<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0416"/>
      <stop offset="100%" stop-color="#120820"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="stairGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#2a1a60"/>
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- Starfield -->
  <circle cx="50" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="120" cy="80" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="25" r="2" fill="white" opacity="0.7"/>
  <circle cx="320" cy="60" r="1" fill="white" opacity="0.5"/>
  <circle cx="450" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="580" cy="15" r="1" fill="white" opacity="0.4"/>
  <circle cx="650" cy="55" r="2" fill="white" opacity="0.7"/>
  <circle cx="750" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="700" cy="90" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="80" cy="130" r="1" fill="white" opacity="0.4"/>
  <circle cx="160" cy="160" r="1.5" fill="#ffd700" opacity="0.5"/>
  <circle cx="380" cy="110" r="1" fill="white" opacity="0.6"/>
  <circle cx="500" cy="80" r="1" fill="#ffd700" opacity="0.4"/>
  <circle cx="720" cy="140" r="1.5" fill="white" opacity="0.5"/>

  <!-- Sun / Rising Destiny - large glowing sun at top center-right -->
  <circle cx="580" cy="120" r="120" fill="url(#haloGlow)"/>
  <circle cx="580" cy="120" r="75" fill="url(#sunGlow)" opacity="0.15"/>
  <circle cx="580" cy="120" r="50" fill="#ffd700" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="580" cy="120" r="38" fill="#fff8e0"/>

  <!-- Sun face details -->
  <circle cx="572" cy="114" r="4" fill="#a06000"/>
  <circle cx="590" cy="114" r="4" fill="#a06000"/>
  <path d="M570,128 Q581,136 592,128" fill="none" stroke="#a06000" stroke-width="2.5"/>

  <!-- Sun rays -->
  <line x1="580" y1="60" x2="580" y2="40" stroke="#ffd700" stroke-width="3" opacity="0.8"/>
  <line x1="580" y1="180" x2="580" y2="200" stroke="#ffd700" stroke-width="3" opacity="0.8"/>
  <line x1="520" y1="120" x2="500" y2="120" stroke="#ffd700" stroke-width="3" opacity="0.8"/>
  <line x1="640" y1="120" x2="660" y2="120" stroke="#ffd700" stroke-width="3" opacity="0.8"/>
  <line x1="537" y1="77" x2="522" y2="62" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>
  <line x1="623" y1="163" x2="638" y2="178" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>
  <line x1="537" y1="163" x2="522" y2="178" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>
  <line x1="623" y1="77" x2="638" y2="62" stroke="#ffd700" stroke-width="2.5" opacity="0.7"/>

  <!-- Zodiac ring around sun -->
  <circle cx="580" cy="120" r="100" fill="none" stroke="#ffd700" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="580" y="24" fill="#ffd700" font-size="11" text-anchor="middle" opacity="0.6">♈</text>
  <text x="675" y="55" fill="#ffd700" font-size="11" text-anchor="middle" opacity="0.6">♌</text>
  <text x="675" y="195" fill="#ffd700" font-size="11" text-anchor="middle" opacity="0.6">♐</text>
  <text x="580" y="228" fill="#ffd700" font-size="11" text-anchor="middle" opacity="0.6">♎</text>
  <text x="485" y="55" fill="#ffd700" font-size="11" text-anchor="middle" opacity="0.6">♊</text>
  <text x="485" y="195" fill="#ffd700" font-size="11" text-anchor="middle" opacity="0.6">♒</text>

  <!-- Grand staircase going up from lower left to upper center -->
  <!-- Step 1 - bottom -->
  <rect x="60" y="430" width="160" height="30" fill="url(#stairGrad)" stroke="#4a3a80" stroke-width="1"/>
  <rect x="60" y="400" width="140" height="30" fill="url(#stairGrad)" stroke="#4a3a80" stroke-width="1"/>
  <rect x="60" y="370" width="120" height="30" fill="url(#stairGrad)" stroke="#4a3a80" stroke-width="1"/>
  <rect x="60" y="340" width="100" height="30" fill="url(#stairGrad)" stroke="#4a3a80" stroke-width="1"/>
  <rect x="60" y="310" width="80" height="30" fill="url(#stairGrad)" stroke="#4a3a80" stroke-width="1"/>
  <rect x="60" y="280" width="60" height="30" fill="url(#stairGrad)" stroke="#4a3a80" stroke-width="1"/>

  <!-- Gold edge trim on stairs -->
  <line x1="60" y1="430" x2="220" y2="430" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="400" x2="200" y2="400" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="370" x2="180" y2="370" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="340" x2="160" y2="340" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="310" x2="140" y2="310" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="280" x2="120" y2="280" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>

  <!-- Step labels -->
  <text x="140" y="448" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7" font-family="monospace">FOUNDATION</text>
  <text x="130" y="418" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7" font-family="monospace">SKILL</text>
  <text x="120" y="388" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7" font-family="monospace">GROWTH</text>
  <text x="110" y="358" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7" font-family="monospace">AUTHORITY</text>
  <text x="100" y="328" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7" font-family="monospace">MASTERY</text>
  <text x="90" y="298" fill="#ffd700" font-size="9" text-anchor="middle" opacity="0.7" font-family="monospace">SUCCESS</text>

  <!-- Professional figure climbing - standing on top step -->
  <!-- Legs -->
  <line x1="98" y1="248" x2="90" y2="278" stroke="#c8a060" stroke-width="6" stroke-linecap="round"/>
  <line x1="112" y1="248" x2="120" y2="278" stroke="#c8a060" stroke-width="6" stroke-linecap="round"/>
  <!-- Suit body -->
  <rect x="82" y="200" width="42" height="52" rx="6" fill="#1a2a5a"/>
  <!-- Suit lapels -->
  <path d="M90,200 L103,215 L116,200" fill="none" stroke="#2a3a6a" stroke-width="2"/>
  <line x1="103" y1="215" x2="103" y2="250" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Tie -->
  <path d="M99,200 L103,225 L107,200" fill="#ffd700" opacity="0.8"/>
  <!-- Head -->
  <circle cx="103" cy="185" r="18" fill="#f0c898"/>
  <!-- Hair -->
  <path d="M88,178 Q103,168 118,178 L118,183 Q103,173 88,183 Z" fill="#5a3010"/>
  <!-- Briefcase in right hand -->
  <rect x="118" y="220" width="25" height="18" rx="3" fill="#8b6020" stroke="#c8920a" stroke-width="1.5"/>
  <rect x="124" y="217" width="13" height="5" rx="2" fill="none" stroke="#c8920a" stroke-width="1.5"/>
  <line x1="118" y1="229" x2="143" y2="229" stroke="#c8920a" stroke-width="1"/>
  <!-- Left arm raised toward sun -->
  <line x1="84" y1="210" x2="65" y2="185" stroke="#f0c898" stroke-width="7" stroke-linecap="round"/>
  <!-- Star sparkles near person -->
  <text x="50" y="180" fill="#ffd700" font-size="16" opacity="0.8">★</text>
  <text x="135" y="170" fill="#ffd700" font-size="12" opacity="0.6">✦</text>

  <!-- Floating planetary symbols -->
  <text x="250" y="200" fill="#ffd700" font-size="28" opacity="0.25">♄</text>
  <text x="350" y="300" fill="#ffd700" font-size="22" opacity="0.2">♃</text>
  <text x="420" y="180" fill="#ffd700" font-size="24" opacity="0.2">☉</text>
  <text x="160" y="350" fill="#ffd700" font-size="20" opacity="0.15">♂</text>
  <text x="300" y="420" fill="#ffd700" font-size="18" opacity="0.2">☿</text>

  <!-- 10th House / Karma Bhava arc label -->
  <path d="M 180,250 Q 380,130 540,160" fill="none" stroke="#ffd700" stroke-width="1" stroke-dasharray="6 4" opacity="0.35"/>
  <text x="340" y="170" fill="#ffd700" font-size="11" text-anchor="middle" opacity="0.5" letter-spacing="2" font-family="monospace">10th HOUSE · KARMA BHAVA</text>

  <!-- Decorative mandala in lower right -->
  <circle cx="700" cy="430" r="90" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.2"/>
  <circle cx="700" cy="430" r="65" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.2"/>
  <circle cx="700" cy="430" r="40" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <text x="700" y="435" fill="#ffd700" font-size="36" text-anchor="middle" opacity="0.25">☉</text>
  <!-- Mandala petals -->
  <ellipse cx="700" cy="367" rx="8" ry="20" fill="#ffd700" opacity="0.1"/>
  <ellipse cx="700" cy="493" rx="8" ry="20" fill="#ffd700" opacity="0.1"/>
  <ellipse cx="637" cy="430" rx="20" ry="8" fill="#ffd700" opacity="0.1"/>
  <ellipse cx="763" cy="430" rx="20" ry="8" fill="#ffd700" opacity="0.1"/>
  <ellipse cx="654" cy="383" rx="8" ry="20" transform="rotate(45,654,383)" fill="#ffd700" opacity="0.1"/>
  <ellipse cx="746" cy="477" rx="8" ry="20" transform="rotate(45,746,477)" fill="#ffd700" opacity="0.1"/>
  <ellipse cx="746" cy="383" rx="8" ry="20" transform="rotate(-45,746,383)" fill="#ffd700" opacity="0.1"/>
  <ellipse cx="654" cy="477" rx="8" ry="20" transform="rotate(-45,654,477)" fill="#ffd700" opacity="0.1"/>

  <!-- Title text overlay at bottom -->
  <rect x="0" y="490" width="800" height="70" fill="#0a0416" opacity="0.7"/>
  <text x="400" y="523" fill="#ffd700" font-size="22" text-anchor="middle" letter-spacing="4" font-family="Georgia, serif" font-weight="bold">HAPPY PROFESSION &amp; CAREER GUIDANCE</text>
  <text x="400" y="548" fill="#c8a060" font-size="12" text-anchor="middle" letter-spacing="2" font-family="monospace" opacity="0.8">10th HOUSE · KARMA BHAVA · AMATYAKARAKA</text>
</svg>
