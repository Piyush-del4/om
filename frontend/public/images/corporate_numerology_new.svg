<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070211"/>
      <stop offset="100%" stop-color="#140624"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffb700"/>
      <stop offset="100%" stop-color="#c8920a"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb700" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- Golden ambient light -->
  <circle cx="400" cy="240" r="280" fill="url(#aurora)"/>

  <!-- Chaldean Table Backdrop (grid) -->
  <rect x="50" y="70" width="300" height="380" rx="10" fill="#110820" stroke="#c8920a" stroke-width="1" opacity="0.6"/>
  <text x="200" y="105" fill="#ffd700" font-size="14" text-anchor="middle" font-family="monospace" letter-spacing="2" font-weight="bold">CHALDEAN VALUES</text>
  
  <!-- Grid Lines -->
  <line x1="50" y1="120" x2="350" y2="120" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="160" x2="350" y2="160" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="240" x2="350" y2="240" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="280" x2="350" y2="280" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="320" x2="350" y2="320" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="360" x2="350" y2="360" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="400" x2="350" y2="400" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="125" y1="120" x2="125" y2="440" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="200" y1="120" x2="200" y2="440" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>
  <line x1="275" y1="120" x2="275" y2="440" stroke="#c8920a" stroke-width="0.5" opacity="0.4"/>

  <!-- Chaldean values inside matrix -->
  <text x="87" y="145" fill="white" font-size="12" text-anchor="middle" font-family="monospace">1 = A I J Q Y</text>
  <text x="162" y="145" fill="white" font-size="12" text-anchor="middle" font-family="monospace">2 = B K R</text>
  <text x="237" y="145" fill="white" font-size="12" text-anchor="middle" font-family="monospace">3 = C G L S</text>
  <text x="312" y="145" fill="white" font-size="12" text-anchor="middle" font-family="monospace">4 = D M T</text>
  <text x="87" y="185" fill="white" font-size="12" text-anchor="middle" font-family="monospace">5 = E H N X</text>
  <text x="162" y="185" fill="white" font-size="12" text-anchor="middle" font-family="monospace">6 = U V W</text>
  <text x="237" y="185" fill="white" font-size="12" text-anchor="middle" font-family="monospace">7 = O Z</text>
  <text x="312" y="185" fill="white" font-size="12" text-anchor="middle" font-family="monospace">8 = F P</text>

  <!-- Spelling analysis example: SUCCESS (3+6+3+3+5+3+3 = 26 -> 8 or tuned to 15 / 24 / 33 / 51) -->
  <text x="200" y="230" fill="#ffd700" font-size="13" text-anchor="middle" font-family="monospace" letter-spacing="1">BRAND SPELLING TUNE</text>
  <text x="200" y="270" fill="white" font-size="24" text-anchor="middle" font-family="monospace" font-weight="bold" letter-spacing="6">A M Z O N</text>
  <text x="200" y="300" fill="#ffd700" font-size="12" text-anchor="middle" font-family="monospace" letter-spacing="4">1 + 4 + 7 + 7 + 5 = 24</text>
  <text x="200" y="335" fill="#00ffcc" font-size="12" text-anchor="middle" font-family="monospace" letter-spacing="1">24 = 2+4 = 6 (FORTUNE &amp; HARMONY)</text>

  <!-- Planetary indicators inside Chaldean container -->
  <circle cx="100" cy="390" r="20" fill="#1b122c" stroke="#ffd700" stroke-width="1"/>
  <text x="100" y="396" fill="#ffd700" font-size="18" text-anchor="middle">☉</text>
  <text x="100" y="425" fill="#c8920a" font-size="9" text-anchor="middle" font-family="monospace">LEADER (1)</text>

  <circle cx="200" cy="390" r="20" fill="#1b122c" stroke="#ffd700" stroke-width="1"/>
  <text x="200" y="396" fill="#ffd700" font-size="18" text-anchor="middle">☿</text>
  <text x="200" y="425" fill="#c8920a" font-size="9" text-anchor="middle" font-family="monospace">GROWTH (5)</text>

  <circle cx="300" cy="390" r="20" fill="#1b122c" stroke="#ffd700" stroke-width="1"/>
  <text x="300" y="396" fill="#ffd700" font-size="18" text-anchor="middle">♀</text>
  <text x="300" y="425" fill="#c8920a" font-size="9" text-anchor="middle" font-family="monospace">BRAND (6)</text>


  <!-- Corporate Empire / Skyscrapers (Modern Business Illustration) on right -->
  <!-- Building 1 (Tall back) -->
  <rect x="520" y="100" width="80" height="350" rx="3" fill="#160e28" stroke="#c8920a" stroke-width="0.8"/>
  <line x1="560" y1="100" x2="560" y2="450" stroke="#c8920a" stroke-width="0.5" opacity="0.3"/>
  <!-- WindowsBuilding 1 -->
  <rect x="530" y="120" width="15" height="15" fill="#ffd700" opacity="0.2"/>
  <rect x="530" y="150" width="15" height="15" fill="#ffd700" opacity="0.4"/>
  <rect x="530" y="180" width="15" height="15" fill="#ffd700" opacity="0.3"/>
  <rect x="530" y="210" width="15" height="15" fill="#ffd700" opacity="0.2"/>
  <rect x="575" y="120" width="15" height="15" fill="#ffd700" opacity="0.5" filter="url(#glow)"/>
  <rect x="575" y="150" width="15" height="15" fill="#ffd700" opacity="0.2"/>
  <rect x="575" y="180" width="15" height="15" fill="#ffd700" opacity="0.4"/>
  <rect x="575" y="210" width="15" height="15" fill="#ffd700" opacity="0.3"/>

  <!-- Building 2 (Main foreground) -->
  <rect x="620" y="160" width="110" height="290" rx="4" fill="#201538" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Diagonal stripes representing modern structural lines -->
  <path d="M620,200 L730,260" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <path d="M620,260 L730,320" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <path d="M620,320 L730,380" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
  <!-- Glow windows -->
  <rect x="640" y="200" width="20" height="25" fill="#ffd700" opacity="0.7" filter="url(#glow)"/>
  <rect x="680" y="200" width="20" height="25" fill="#ffd700" opacity="0.3"/>
  <rect x="640" y="250" width="20" height="25" fill="#ffd700" opacity="0.4"/>
  <rect x="680" y="250" width="20" height="25" fill="#ffd700" opacity="0.8" filter="url(#glow)"/>
  <rect x="640" y="300" width="20" height="25" fill="#ffd700" opacity="0.3"/>
  <rect x="680" y="300" width="20" height="25" fill="#ffd700" opacity="0.5"/>

  <!-- Rising arrow of business profit orbiting buildings -->
  <path d="M 480,420 Q 560,330 630,210 Q 660,160 700,120" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="700,120 685,123 697,135" fill="#ffd700"/>
  <text x="635" y="195" fill="#ffd700" font-size="11" font-family="monospace" letter-spacing="1">PROFIT GROWTH</text>

  <!-- Incorporation alignment seal -->
  <circle cx="480" cy="180" r="32" fill="#1b122c" stroke="#ffd700" stroke-width="1.5" opacity="0.9"/>
  <circle cx="480" cy="180" r="28" fill="none" stroke="#c8920a" stroke-width="0.5" stroke-dasharray="2 2"/>
  <text x="480" y="174" fill="#ffd700" font-size="8" text-anchor="middle" font-family="monospace">INCORP.</text>
  <text x="480" y="185" fill="white" font-size="10" text-anchor="middle" font-weight="bold" font-family="monospace">DATE</text>
  <text x="480" y="195" fill="#ffd700" font-size="8" text-anchor="middle" font-family="monospace">★ ALIGNED ★</text>

  <!-- Title section -->
  <rect x="0" y="500" width="800" height="60" fill="#070211" opacity="0.85"/>
  <text x="400" y="525" fill="url(#goldGrad)" font-size="22" text-anchor="middle" letter-spacing="4" font-weight="bold">CORPORATE &amp; BRAND NUMEROLOGY</text>
  <text x="400" y="547" fill="#ffd700" font-size="11" text-anchor="middle" letter-spacing="2" font-family="monospace" opacity="0.8">SPELLING CORRECTION · LOGO DESIGNS · PARTNERSHIP COMPATIBILITY</text>
</svg>
