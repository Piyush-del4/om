<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2a40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="100%" stop-color="#060e22"/>
    </linearGradient>
    <radialGradient id="digitalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- Circuit grid lines background -->
  <line x1="0" y1="140" x2="800" y2="140" stroke="#1a3060" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#1a3060" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#1a3060" stroke-width="0.5" opacity="0.4"/>
  <line x1="200" y1="0" x2="200" y2="560" stroke="#1a3060" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="0" x2="400" y2="560" stroke="#1a3060" stroke-width="0.5" opacity="0.4"/>
  <line x1="600" y1="0" x2="600" y2="560" stroke="#1a3060" stroke-width="0.5" opacity="0.4"/>

  <!-- Big digital aura circle -->
  <circle cx="400" cy="280" r="200" fill="url(#digitalGlow)"/>
  <circle cx="400" cy="280" r="180" fill="none" stroke="#00ccff" stroke-width="0.6" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="400" cy="280" r="150" fill="none" stroke="#ffd700" stroke-width="0.5" stroke-dasharray="2 8" opacity="0.3"/>

  <!-- Smartphone body -->
  <rect x="320" y="120" width="160" height="310" rx="22" fill="url(#phoneGrad)" stroke="#00ccff" stroke-width="2"/>
  <rect x="320" y="120" width="160" height="310" rx="22" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.5"/>

  <!-- Phone notch/camera -->
  <rect x="375" y="130" width="50" height="12" rx="6" fill="#060e22"/>
  <circle cx="400" cy="136" r="3" fill="#00ccff" opacity="0.5"/>

  <!-- Phone screen -->
  <rect x="330" y="148" width="140" height="250" rx="4" fill="url(#screenGrad)"/>

  <!-- Screen: Numerology digit display -->
  <text x="400" y="185" fill="#ffd700" font-size="11" text-anchor="middle" letter-spacing="2" font-family="monospace" opacity="0.8">YOUR COSMIC NUMBER</text>
  <!-- Big number 7 on screen -->
  <text x="400" y="250" fill="#ffd700" font-size="80" text-anchor="middle" font-weight="bold" filter="url(#glow)">7</text>
  <text x="400" y="270" fill="#00ccff" font-size="9" text-anchor="middle" letter-spacing="3" font-family="monospace" opacity="0.9">SPIRITUAL · SUCCESS</text>

  <!-- Number sequence row on screen -->
  <text x="350" y="305" fill="#00ccff" font-size="16" text-anchor="middle" font-family="monospace" opacity="0.7">9</text>
  <text x="370" y="305" fill="#ffd700" font-size="16" text-anchor="middle" font-family="monospace" opacity="0.7">8</text>
  <text x="390" y="305" fill="white" font-size="16" text-anchor="middle" font-family="monospace" opacity="0.6">7</text>
  <text x="410" y="305" fill="#ffd700" font-size="16" text-anchor="middle" font-family="monospace" opacity="0.7">6</text>
  <text x="430" y="305" fill="#00ccff" font-size="16" text-anchor="middle" font-family="monospace" opacity="0.7">5</text>

  <!-- Vibration bars on screen -->
  <rect x="345" y="320" width="8" height="25" rx="2" fill="#ffd700" opacity="0.6"/>
  <rect x="360" y="310" width="8" height="35" rx="2" fill="#00ccff" opacity="0.8"/>
  <rect x="375" y="315" width="8" height="30" rx="2" fill="#ffd700" opacity="0.9"/>
  <rect x="390" y="305" width="8" height="40" rx="2" fill="#00ccff" opacity="1"/>
  <rect x="405" y="318" width="8" height="27" rx="2" fill="#ffd700" opacity="0.7"/>
  <rect x="420" y="312" width="8" height="33" rx="2" fill="#00ccff" opacity="0.8"/>
  <rect x="435" y="322" width="8" height="23" rx="2" fill="#ffd700" opacity="0.5"/>

  <!-- Screen bottom: compatibility -->
  <text x="400" y="378" fill="#c8a060" font-size="9" text-anchor="middle" letter-spacing="1" font-family="monospace">DRIVER ♦ CONDUCTOR ALIGNED</text>

  <!-- Home button at bottom of phone -->
  <circle cx="400" cy="408" r="12" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.7"/>

  <!-- Floating numbers orbiting the phone - left side -->
  <circle cx="400" cy="280" r="120" fill="none"/>
  <!-- Number 1 -->
  <circle cx="250" cy="210" r="24" fill="#0a1428" stroke="#ffd700" stroke-width="1.5" opacity="0.9"/>
  <text x="250" y="217" fill="#ffd700" font-size="22" text-anchor="middle" font-weight="bold" font-family="monospace">1</text>
  <text x="250" y="243" fill="#c8a060" font-size="7" text-anchor="middle" letter-spacing="1" font-family="monospace">SUN</text>
  <!-- Number 5 -->
  <circle cx="200" cy="290" r="24" fill="#0a1428" stroke="#00ccff" stroke-width="1.5" opacity="0.9"/>
  <text x="200" y="297" fill="#00ccff" font-size="22" text-anchor="middle" font-weight="bold" font-family="monospace">5</text>
  <text x="200" y="321" fill="#80c0ff" font-size="7" text-anchor="middle" letter-spacing="1" font-family="monospace">MERCURY</text>
  <!-- Number 6 -->
  <circle cx="245" cy="375" r="24" fill="#0a1428" stroke="#ff80c0" stroke-width="1.5" opacity="0.9"/>
  <text x="245" y="382" fill="#ff80c0" font-size="22" text-anchor="middle" font-weight="bold" font-family="monospace">6</text>
  <text x="245" y="406" fill="#ff80c0" font-size="7" text-anchor="middle" letter-spacing="1" font-family="monospace">VENUS</text>

  <!-- Number 9 - right -->
  <circle cx="555" cy="210" r="24" fill="#0a1428" stroke="#ff6040" stroke-width="1.5" opacity="0.9"/>
  <text x="555" y="217" fill="#ff6040" font-size="22" text-anchor="middle" font-weight="bold" font-family="monospace">9</text>
  <text x="555" y="241" fill="#ff6040" font-size="7" text-anchor="middle" letter-spacing="1" font-family="monospace">MARS</text>
  <!-- Number 3 - right -->
  <circle cx="600" cy="295" r="24" fill="#0a1428" stroke="#a080ff" stroke-width="1.5" opacity="0.9"/>
  <text x="600" y="302" fill="#a080ff" font-size="22" text-anchor="middle" font-weight="bold" font-family="monospace">3</text>
  <text x="600" y="326" fill="#a080ff" font-size="7" text-anchor="middle" letter-spacing="1" font-family="monospace">JUPITER</text>
  <!-- Number 8 - right lower -->
  <circle cx="552" cy="375" r="24" fill="#0a1428" stroke="#888888" stroke-width="1.5" opacity="0.9"/>
  <text x="552" y="382" fill="#888" font-size="22" text-anchor="middle" font-weight="bold" font-family="monospace">8</text>
  <text x="552" y="406" fill="#888" font-size="7" text-anchor="middle" letter-spacing="1" font-family="monospace">SATURN</text>

  <!-- Orbiting connection lines -->
  <line x1="274" y1="214" x2="320" y2="210" stroke="#ffd700" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="224" y1="290" x2="320" y2="270" stroke="#00ccff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="268" y1="370" x2="320" y2="350" stroke="#ff80c0" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="531" y1="216" x2="480" y2="210" stroke="#ff6040" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="576" y1="295" x2="480" y2="275" stroke="#a080ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="529" y1="371" x2="480" y2="350" stroke="#888" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Cosmic numerology formula at bottom -->
  <rect x="200" y="460" width="400" height="40" rx="8" fill="#0a1428" stroke="#ffd700" stroke-width="0.8" opacity="0.8"/>
  <text x="400" y="478" fill="#ffd700" font-size="10" text-anchor="middle" letter-spacing="3" font-family="monospace" opacity="0.9">DRIVER + CONDUCTOR = LUCKY TOTAL</text>
  <text x="400" y="493" fill="#00ccff" font-size="9" text-anchor="middle" letter-spacing="2" font-family="monospace" opacity="0.7">9 × 10 DIGITS SUMMED = YOUR VIBRATION</text>

  <!-- Title -->
  <rect x="0" y="510" width="800" height="50" fill="#050a18" opacity="0.8"/>
  <text x="400" y="534" fill="#ffd700" font-size="22" text-anchor="middle" letter-spacing="4" font-family="Georgia, serif" font-weight="bold">LUCKY MOBILE NUMBER SELECTION</text>
  <text x="400" y="552" fill="#00ccff" font-size="11" text-anchor="middle" letter-spacing="2" font-family="monospace" opacity="0.7">ALIGN YOUR FREQUENCY · ATTRACT PROSPERITY</text>
</svg>
