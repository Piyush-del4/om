<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0005"/>
      <stop offset="100%" stop-color="#1c0512"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffa0b0"/>
      <stop offset="100%" stop-color="#ff6080"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)"/>

  <!-- Star field background -->
  <circle cx="100" cy="50" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="120" r="1.5" fill="#ffa0b0" opacity="0.5"/>
  <circle cx="350" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="650" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="720" cy="180" r="1" fill="#ffd700" opacity="0.4"/>

  <!-- Big Red/Pink Heart Glow in Center -->
  <circle cx="400" cy="230" r="250" fill="url(#heartGlow)"/>

  <!-- Sacred Vedic Astrology Chart Wheels (Left and Right - groom & bride) -->
  <!-- Left Chart (Male) -->
  <g transform="translate(180, 230)">
    <circle cx="0" cy="0" r="90" fill="#12040b" stroke="#ffd700" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#ffd700" stroke-width="0.5" stroke-dasharray="2 3"/>
    <!-- Chart lines (North Indian Style Diamond Grid) -->
    <rect x="-63" y="-63" width="126" height="126" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(45)"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#ffd700" stroke-width="0.8"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#ffd700" stroke-width="0.8"/>
    <!-- House labels / Planets -->
    <text x="0" y="-35" fill="white" font-size="9" text-anchor="middle" font-family="monospace">GURU</text>
    <text x="-40" y="0" fill="white" font-size="9" text-anchor="middle" font-family="monospace">CHANDRA</text>
    <text x="0" y="45" fill="#ff6080" font-size="9" text-anchor="middle" font-family="monospace">MANGAL</text>
    <!-- Label -->
    <text x="0" y="115" fill="#ffd700" font-size="11" text-anchor="middle" font-family="monospace" letter-spacing="1">GROOM CHART</text>
  </g>

  <!-- Right Chart (Female) -->
  <g transform="translate(620, 230)">
    <circle cx="0" cy="0" r="90" fill="#12040b" stroke="#ffd700" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#ffd700" stroke-width="0.5" stroke-dasharray="2 3"/>
    <!-- Chart lines (North Indian Style Grid) -->
    <rect x="-63" y="-63" width="126" height="126" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(45)"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#ffd700" stroke-width="0.8"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#ffd700" stroke-width="0.8"/>
    <!-- House labels / Planets -->
    <text x="0" y="-35" fill="white" font-size="9" text-anchor="middle" font-family="monospace">SHUKRA</text>
    <text x="40" y="0" fill="white" font-size="9" text-anchor="middle" font-family="monospace">CHANDRA</text>
    <text x="0" y="45" fill="white" font-size="9" text-anchor="middle" font-family="monospace">BUDHA</text>
    <!-- Label -->
    <text x="0" y="115" fill="#ffd700" font-size="11" text-anchor="middle" font-family="monospace" letter-spacing="1">BRIDE CHART</text>
  </g>

  <!-- Connection rays between charts -->
  <path d="M 270,230 L 530,230" stroke="#ff3366" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Centerpiece: Sacred Marriage Union Symbolism -->
  <!-- Golden Mandala of Marriage (Union) -->
  <circle cx="400" cy="230" r="60" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  <circle cx="400" cy="230" r="54" fill="none" stroke="#ff6080" stroke-width="0.8"/>

  <!-- Double Hearts intersected inside center mandala -->
  <path d="M 388,230 C 388,222 396,218 400,224 C 404,218 412,222 412,230 C 412,238 400,244 400,244 C 400,244 388,238 388,230 Z" fill="#ff3366" opacity="0.85" filter="url(#glow)"/>
  
  <!-- Sacred Havan / Fire underneath -->
  <!-- Altar base -->
  <polygon points="360,360 440,360 425,385 375,385" fill="#2a1a10" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Fire logs -->
  <line x1="380" y1="360" x2="420" y2="350" stroke="#8b4513" stroke-width="4"/>
  <line x1="420" y1="360" x2="380" y2="350" stroke="#8b4513" stroke-width="4"/>
  <!-- Flames -->
  <path d="M380,350 Q400,310 400,295 Q415,315 420,350" fill="#ffa020" opacity="0.8" filter="url(#glow)"/>
  <path d="M390,350 Q400,325 403,310 Q408,328 410,350" fill="#ff3300" opacity="0.9"/>
  <path d="M396,350 Q400,335 400,328 Q404,335 404,350" fill="#ffd700" opacity="0.9"/>

  <!-- Sacred points callout (36 GUNAS score) -->
  <rect x="340" y="90" width="120" height="36" rx="6" fill="#1c0512" stroke="#ffd700" stroke-width="1" opacity="0.9"/>
  <text x="400" y="105" fill="#ff3366" font-size="11" text-anchor="middle" font-family="monospace" letter-spacing="1">GUNAMELAPAK</text>
  <text x="400" y="120" fill="white" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">36 / 36 MATCH</text>

  <!-- Manglik Compatibility Seal -->
  <circle cx="400" cy="160" r="16" fill="#ff3366" opacity="0.2"/>
  <circle cx="400" cy="160" r="12" fill="none" stroke="#ff3366" stroke-width="1"/>
  <text x="400" y="163" fill="#ff3366" font-size="9" text-anchor="middle" font-family="monospace" font-weight="bold">MA</text>

  <!-- Title section -->
  <rect x="0" y="500" width="800" height="60" fill="#0a0005" opacity="0.85"/>
  <text x="400" y="525" fill="url(#goldGrad)" font-size="22" text-anchor="middle" letter-spacing="4" font-weight="bold">VEDIC MARRIAGE MATCHING</text>
  <text x="400" y="547" fill="#ffd700" font-size="11" text-anchor="middle" letter-spacing="2" font-family="monospace" opacity="0.8">36 GUNA ANALYSIS · MANGLIK DOSHA COMPATIBILITY · 7th HOUSE STABILITY</text>
</svg>
